[build-system]
requires = ["setuptools>=61.0", "wheel", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ftvp"
version = "2.0.0"
description = "Fast Total Variation Proximal operator on GPU"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Samuel Vaiter", email = "samuel.vaiter@cnrs.fr"},
]
keywords = ["total-variation", "proximal-operator", "cuda", "pytorch", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "ninja",
]

[project.optional-dependencies]
examples = [
    "numpy",
    "pillow",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "numpy",
    "pillow",
]

[project.urls]
Homepage = "https://github.com/svaiter/ftvp"
Repository = "https://github.com/svaiter/ftvp"
Issues = "https://github.com/svaiter/ftvp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ftvp*"]
